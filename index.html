<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دورة زمقتال | مسجد الروضة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-color: #1a3322; 
            --gold-color: #c09d57; 
            --bg-color: #f7f6f0; 
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .form-container { 
            background-color: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            border-top: 5px solid var(--primary-color); 
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: var(--primary-color); margin: 0 0 10px 0; }
        .header p { color: #666; font-size: 14px; margin: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--primary-color); font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { border-color: var(--gold-color); outline: none; }
        button { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: var(--gold-color); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; display: none; padding: 10px; border-radius: 6px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h2>التسجيل في دورة زمقتال</h2>
            <p>دورة الفنون القتالية الدفاعية - مسجد الروضة</p>
        </div>
        <form id="registrationForm">
            <div class="form-group">
                <label>الاسم الثلاثي للطالب</label>
                <input type="text" id="fullName" required placeholder="أدخل اسم الطالب الكامل">
            </div>
            <div class="form-group">
                <label>الفئة العمرية</label>
                <select id="ageGroup" required>
                    <option value="" disabled selected>اختر الفئة...</option>
                    <option value="الفئة الثانية (8 إلى 16 سنة)">الفئة الثانية (8 إلى 16 سنة) - 9:30 صباحاً</option>
                    <option value="الفئة الأولى (+16 سنة)">الفئة الأولى (+16 سنة) - 8:00 صباحاً</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم الحلقة</label>
                <select id="halaqa" required>
                    <option value="" disabled selected>جاري تحميل الحلقات...</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الهاتف (واتساب)</label>
                <input type="tel" id="phone" required placeholder="مثال: 09XXXXXXXX">
            </div>
            <div class="form-group">
                <label>ملاحظات طبية (اختياري)</label>
                <input type="text" id="notes" placeholder="أمراض، إصابات سابقة، إلخ...">
            </div>
            <button type="submit" id="submitBtn">تأكيد التسجيل</button>
            <div id="message"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtoQqjmj-3ZrSC8cHFSh3jZuHmXLlOYeE",
            authDomain: "rawda-zamaktl.firebaseapp.com",
            projectId: "rawda-zamaktl",
            storageBucket: "rawda-zamaktl.firebasestorage.app",
            messagingSenderId: "919245914391",
            appId: "1:919245914391:web:67848c676d1aaeb3ebf752"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جلب الحلقات
        async function loadHalaqas() {
            const halaqaSelect = document.getElementById('halaqa');
            try {
                const querySnapshot = await getDocs(collection(db, "halaqas"));
                halaqaSelect.innerHTML = '<option value="" disabled selected>اختر حلقة الطالب...</option>';
                querySnapshot.forEach((doc) => {
                    const halaqaName = doc.data().name;
                    const option = document.createElement('option');
                    option.value = halaqaName;
                    option.textContent = halaqaName;
                    halaqaSelect.appendChild(option);
                });
                const noHalaqa = document.createElement('option');
                noHalaqa.value = "لا يوجد (غير مسجل بحلقة)";
                noHalaqa.textContent = "لا يوجد (غير مسجل بحلقة)";
                halaqaSelect.appendChild(noHalaqa);
            } catch (error) {
                halaqaSelect.innerHTML = '<option value="" disabled selected>خطأ في تحميل الحلقات</option>';
            }
        }
        loadHalaqas();

        // إرسال الفورم
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الإرسال...";
            messageDiv.style.display = "none";

            try {
                await addDoc(collection(db, "students"), {
                    name: document.getElementById('fullName').value.trim(),
                    ageGroup: document.getElementById('ageGroup').value,
                    halaqa: document.getElementById('halaqa').value,
                    phone: document.getElementById('phone').value.trim(),
                    notes: document.getElementById('notes').value.trim() || "لا يوجد",
                    timestamp: serverTimestamp()
                });
                
                messageDiv.className = "success";
                messageDiv.innerText = "تم التسجيل بنجاح!";
                messageDiv.style.display = "block";
                form.reset();
            } catch (error) {
                messageDiv.className = "error";
                messageDiv.innerText = "حدث خطأ أثناء التسجيل. تأكد من اتصالك بالإنترنت.";
                messageDiv.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد التسجيل";
            }
        });
    </script>
</body>
</html>
